# SPDX-License-Identifier: LGPL-3.0-or-later
#
# Build and test on every push and pull request. A v* tag also publishes a
# GitHub release with the meson dist tarball, once everything else passes.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all deps
            cc: gcc
            features: enabled
            options: ''
          - name: no optional deps
            cc: gcc
            features: disabled
            options: ''
          - name: clang, sanitizers
            cc: clang
            features: enabled
            options: -Db_sanitize=address,undefined -Db_lundef=false
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build \
            pkg-config gcc clang libopus-dev libudev-dev libpipewire-0.3-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          meson setup build -Dwerror=true \
            -Dudev=${{ matrix.features }} -Dpipewire=${{ matrix.features }} \
            ${{ matrix.options }}
      - name: Build
        run: meson compile -C build
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build --print-errorlogs
      - name: Version
        run: |
          ./build/ds4ld --version
          ./build/ds4l --version

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          shellcheck install.sh uninstall.sh tools/*.sh driver/*.sh
      - name: Python syntax
        run: python3 -m py_compile tools/bt_gap_probe.py

  # The vendored driver needs Linux >= 6.12. Ubuntu 24.04's HWE headers are
  # the oldest kernel covered here; Arch's are the newest stable.
  driver:
    name: driver (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 HWE kernel
            container: ''
          - name: Arch Linux kernel
            container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kernel headers
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed base-devel linux-headers
            kdir="$(printf '%s\n' /usr/lib/modules/*/build | sort -V | tail -n1)"
            cc=gcc
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential \
              linux-headers-generic-hwe-24.04
            kdir="$(printf '%s\n' /usr/src/linux-headers-*-generic | sort -V | tail -n1)"
            # Build with the compiler the kernel was built with.
            cc="$(sed -n 's/^CONFIG_CC_VERSION_TEXT="\([^ ]*\) .*/\1/p' "$kdir/.config")"
            sudo apt-get install -y --no-install-recommends "${cc#x86_64-linux-gnu-}"
          fi
          echo "KDIR=$kdir" >> "$GITHUB_ENV"
          echo "KCC=$cc" >> "$GITHUB_ENV"
      - name: Build the module
        run: |
          ver="$(cat "$KDIR/include/config/kernel.release")"
          echo "kernel $ver, $KCC"
          if [ "$(printf '%s\n' 6.12 "$ver" | sort -V | head -n1)" != 6.12 ]; then
            echo "::notice::headers are $ver, older than 6.12: driver build skipped"
            exit 0
          fi
          make -C driver KDIR="$KDIR" CC="$KCC"
          test -f driver/hid-playstation.ko

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, scripts, driver]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build \
            pkg-config gcc libopus-dev libudev-dev libpipewire-0.3-dev
      - name: Check the tag against the project version
        run: |
          meson setup build
          ver="$(meson introspect --projectinfo build | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match meson.build version $ver"
            exit 1
          fi
      - name: Source tarball
        run: meson dist -C build --formats xztar
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/meson-dist/* \
            --verify-tag --title "DS4L ${GITHUB_REF_NAME#v}" --generate-notes
