PACKAGE_NAME="hid-playstation-ds5"
PACKAGE_VERSION="0.1"
# Same name as the in-tree module; updates/dkms takes precedence over it.
BUILT_MODULE_NAME[0]="hid-playstation"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean KDIR=/lib/modules/${kernelver}/build"
AUTOINSTALL="yes"
